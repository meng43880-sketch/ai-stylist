<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><style>
body{width:300px;margin:0;padding:14px;font-family:system-ui,sans-serif;font-size:13px;color:#111}
h1{font-size:15px;margin:0 0 10px}
label{display:block;font-size:12px;color:#666;margin:8px 0 3px}
input{width:100%;box-sizing:border-box;padding:8px;border:1.5px solid #ddd;border-radius:8px;font-size:13px}
button{width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;background:#111;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
#log{margin-top:10px;max-height:180px;overflow-y:auto;background:#f4f4f6;border-radius:8px;padding:8px;font-size:12px;line-height:1.5}
#st{margin-top:8px;font-size:12px;color:#666}
</style></head>
<body>
<h1>sainvio collector</h1>
<label>Backend URL</label>
<input id="backend" placeholder="https://xxx.onrender.com">
<label>COLLECTOR_KEY</label>
<input id="key" placeholder="секрет из backend/.env">
<button id="go">Собрать и отправить</button>
<div id="st"></div>
<div id="log"></div>
<script src="popup.js"></script>
</body>
</html>
